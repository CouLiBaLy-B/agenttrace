name: Publish deepagents-trace to PyPI

# Trusted Publishing (OIDC) — no API token stored in GitHub secrets.
# One-time setup required on pypi.org before the first run (see
# python-server/README.md#publishing): register this repo/workflow as a
# "trusted publisher" for the `deepagents-trace` project.
#
# Release: push a `v<version>` tag (e.g. v0.2.0), before the
# agenttrace-langchain shim that depends on it.
on:
  release:
    types: [published]
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

# Read-only by default; only the publish job gets the OIDC token.
permissions:
  contents: read

# One run per tag at a time (a tag push and a Release of that tag queue up);
# never cancel a run that may be uploading.
concurrency:
  group: publish-pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # A release of the shim's agenttrace-langchain-v* tag is not this package.
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Version is consistent and matches the tag
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if ! grep -qxF "__version__ = \"$version\"" agenttrace/__init__.py; then
            echo "::error::agenttrace/__init__.py __version__ differs from pyproject.toml ($version)"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version in python-server/pyproject.toml"
            exit 1
          fi
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bun run build:ui
        working-directory: .
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - run: python -m pip install build
      - run: python -m build
      - run: python scripts/check_wheel.py dist/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: python-server/dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for OIDC trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          # A tag push and a GitHub Release of that tag both run this
          # workflow: whichever runs second finds the files on PyPI.
          skip-existing: true
