name: Publish deepagents-trace to PyPI

# The deprecated deepagents-trace shim (integrations/deepagents-trace): the
# pre-0.3 distribution name, now depending on lanetrace==0.3.* and keeping
# `import agenttrace` and the `agenttrace` command working.
#
# Trusted Publishing (OIDC) — no API token stored in GitHub secrets.
# One-time setup on pypi.org (see python-server/README.md#publishing): a
# trusted publisher for the `deepagents-trace` project with
#   Owner: CouLiBaLy-B, Repository: lanetrace
#   Workflow filename: publish-deepagents-trace.yml
#   Environment name: pypi-deepagents-trace
#
# Release: push a `deepagents-trace-v<version>` tag (e.g.
# deepagents-trace-v0.3.0) once the lanetrace version it requires is on
# PyPI; the wheel check below installs that dependency from PyPI.
on:
  push:
    tags:
      - "deepagents-trace-v*"
  workflow_dispatch: {}

# Read-only by default; only the publish job gets the OIDC token.
permissions:
  contents: read

# One run per tag at a time; never cancel a run that may be uploading.
concurrency:
  group: publish-deepagents-trace-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/deepagents-trace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Version matches the tag
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "deepagents-trace-v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version in integrations/deepagents-trace/pyproject.toml"
            exit 1
          fi
      - run: python -m pip install build
      - run: python -m build
      - name: Wheel installs, imports agenttrace and runs the agenttrace command
        # Outside the checkout, so `import` loads the installed wheel, not
        # the source tree.
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv wheel-check
          wheel-check/bin/pip install "$GITHUB_WORKSPACE"/integrations/deepagents-trace/dist/*.whl
          wheel-check/bin/python -c "import agenttrace, lanetrace, agenttrace.tracking.fluent; assert agenttrace.tracking.fluent is lanetrace.tracking.fluent"
          wheel-check/bin/agenttrace --version
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: integrations/deepagents-trace/dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi-deepagents-trace
    permissions:
      id-token: write  # required for OIDC trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
