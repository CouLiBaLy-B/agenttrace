# AgentTrace — CI
# Runs on every push and pull request:
#   1. ui      — lint, typecheck, unit tests (Vitest), static export (uploaded as the `ui-bundle` artifact)
#   2. python  — pytest (server + SDK + shim), then a wheel check that the UI ships
#   3. e2e     — Playwright drives the bundled dashboard served by `agenttrace ui`
#   4. docker  — build the single image and smoke test it against Postgres
#
# Bun is used as the runtime/package manager to match local dev.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel in-flight runs for the same ref when a new commit is pushed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────────────────
  # UI: lint + typecheck + static export (Bun)
  # ────────────────────────────────────────────────────────────
  ui:
    name: ui · lint · typecheck · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build:ui
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - uses: actions/upload-artifact@v4
        with:
          name: ui-bundle
          path: python-server/agenttrace/server/static

  # ────────────────────────────────────────────────────────────
  # Docker image (Python server + bundled UI)
  # ────────────────────────────────────────────────────────────
  docker:
    name: docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: agenttrace:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test — server serves the UI and API
        run: |
          # Postgres on a shared network so the server reaches it by DNS name.
          docker network create agenttrace-ci
          docker run -d --name pg --network agenttrace-ci \
            -e POSTGRES_DB=agenttrace \
            -e POSTGRES_USER=agenttrace \
            -e POSTGRES_PASSWORD=agenttrace \
            postgres:16-alpine
          for i in $(seq 1 30); do
            docker exec pg pg_isready -U agenttrace -d agenttrace >/dev/null 2>&1 && { echo "pg ready"; break; }
            sleep 1
          done
          docker run -d --name agenttrace --network agenttrace-ci -p 3000:3000 \
            -e DATABASE_URL="postgresql+psycopg://agenttrace:agenttrace@pg:5432/agenttrace" \
            -e AGENTTRACE_SECRET="ci-secret" \
            agenttrace:ci
          up=0
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/ || echo 000)
            [ "$code" = "200" ] && { echo "server up ($code)"; up=1; break; }
            sleep 1
          done
          [ "$up" = "1" ] || { echo "server did not come up"; docker logs agenttrace; exit 1; }
          curl -s http://localhost:3000/ | grep -q "<title>AgentTrace" || { echo "UI title missing"; docker logs agenttrace; exit 1; }
          curl -sf http://localhost:3000/api/auth/session | grep -q '"authMode":"password"' || { echo "auth session check failed"; docker logs agenttrace; exit 1; }
          echo "smoke test passed"

  # ────────────────────────────────────────────────────────────
  # Python tests + wheel check (needs the UI bundle)
  # ────────────────────────────────────────────────────────────
  python:
    name: python tests
    needs: ui
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download UI bundle
        uses: actions/download-artifact@v4
        with:
          name: ui-bundle
          path: python-server/agenttrace/server/static

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Install
        run: |
          uv venv .venv --python 3.12
          uv pip install --python .venv -e "python-server[dev]" -e integrations/agenttrace-langchain

      - name: Test
        run: |
          .venv/bin/pytest python-server/tests -q
          .venv/bin/pytest integrations/agenttrace-langchain/tests -q

      - name: Wheel ships the UI
        run: |
          uv build python-server --wheel --out-dir dist
          .venv/bin/python python-server/scripts/check_wheel.py dist/*.whl

  # ────────────────────────────────────────────────────────────
  # End-to-end: Playwright against `agenttrace ui` with the bundle
  # ────────────────────────────────────────────────────────────
  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-latest
    needs: ui
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          name: ui-bundle
          path: python-server/agenttrace/server/static
      - name: Install
        run: |
          uv venv .venv --python 3.12
          uv pip install --python .venv "python-server[dev,e2e]"
          .venv/bin/playwright install --with-deps chromium
      # The suite skips without the bundle; in CI a missing bundle must fail.
      - name: Installed package ships the UI bundle
        run: .venv/bin/python -c "import agenttrace.server.app as a, pathlib; assert (pathlib.Path(a.__file__).parent/'static'/'index.html').is_file()"
      - name: E2E
        run: .venv/bin/pytest python-server/tests_e2e -q
