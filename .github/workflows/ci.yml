# LaneTrace — CI
# Runs on pushes to main/master and on every pull request, whatever its base
# (stacked pull requests target feature branches):
#   1. ui      — lint, typecheck, unit tests (Vitest), static export (uploaded as the `ui-bundle` artifact)
#   2. python  — pytest (server + SDK + both shims), the example notebooks, then a wheel check that the UI ships
#   3. e2e     — Playwright drives the bundled dashboard served by `lanetrace ui`
#                (theme screenshots uploaded as the `theme-screenshots` artifact)
#   4. docker  — build the single image and smoke test it against Postgres
#
# Bun is the package manager, as in local dev; the ui job also installs Node 22
# (Vitest 5 needs ^22.12, so it does not rely on the runner image's default).

name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Read-only token: CI runs on every pull request and never writes to the repo.
permissions:
  contents: read

# Cancel in-flight runs for the same ref when a new commit is pushed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────────────────
  # UI: lint + typecheck + unit tests + static export (Bun, Node 22)
  # ────────────────────────────────────────────────────────────
  ui:
    name: ui · lint · typecheck · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build:ui
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - uses: actions/upload-artifact@v4
        with:
          name: ui-bundle
          path: python-server/lanetrace/server/static

  # ────────────────────────────────────────────────────────────
  # Docker image (Python server + bundled UI)
  # ────────────────────────────────────────────────────────────
  docker:
    name: docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: false
          load: true
          tags: lanetrace:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test — server serves the UI and API
        run: |
          # Postgres on a shared network so the server reaches it by DNS name.
          docker network create lanetrace-ci
          docker run -d --name pg --network lanetrace-ci \
            -e POSTGRES_DB=lanetrace \
            -e POSTGRES_USER=lanetrace \
            -e POSTGRES_PASSWORD=lanetrace \
            postgres:16-alpine
          for i in $(seq 1 30); do
            docker exec pg pg_isready -U lanetrace -d lanetrace >/dev/null 2>&1 && { echo "pg ready"; break; }
            sleep 1
          done
          docker run -d --name lanetrace --network lanetrace-ci -p 3000:3000 \
            -e DATABASE_URL="postgresql+psycopg://lanetrace:lanetrace@pg:5432/lanetrace" \
            -e LANETRACE_SECRET="ci-secret" \
            lanetrace:ci
          up=0
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/ || echo 000)
            [ "$code" = "200" ] && { echo "server up ($code)"; up=1; break; }
            sleep 1
          done
          [ "$up" = "1" ] || { echo "server did not come up"; docker logs lanetrace; exit 1; }
          curl -s http://localhost:3000/ | grep -q "<title>LaneTrace" || { echo "UI title missing"; docker logs lanetrace; exit 1; }
          curl -sf http://localhost:3000/api/auth/session | grep -q '"authMode":"password"' || { echo "auth session check failed"; docker logs lanetrace; exit 1; }
          echo "smoke test passed"

  # ────────────────────────────────────────────────────────────
  # Python tests + wheel check (needs the UI bundle)
  # ────────────────────────────────────────────────────────────
  python:
    name: python tests
    needs: ui
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download UI bundle
        uses: actions/download-artifact@v8
        with:
          name: ui-bundle
          path: python-server/lanetrace/server/static

      - name: Setup uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      - name: Install
        run: |
          uv venv .venv --python 3.12
          uv pip install --python .venv -e "./python-server[dev]" \
            -e ./integrations/agenttrace-langchain -e ./integrations/deepagents-trace

      - name: Test
        run: |
          .venv/bin/pytest python-server/tests -q
          .venv/bin/pytest integrations/agenttrace-langchain/tests -q
          .venv/bin/pytest integrations/deepagents-trace/tests -q

      # Offline (scripted models, temp SQLite): a failing cell fails the job.
      - name: Example notebooks run
        run: |
          uv pip install --python .venv nbconvert ipykernel
          .venv/bin/jupyter nbconvert --to notebook --execute \
            --ExecutePreprocessor.kernel_name=python3 --ExecutePreprocessor.timeout=300 \
            --output-dir "$RUNNER_TEMP/notebooks" python-server/examples/notebooks/*.ipynb

      - name: Wheel ships the UI
        run: |
          uv build python-server --wheel --out-dir dist
          .venv/bin/python python-server/scripts/check_wheel.py dist/*.whl

  # ────────────────────────────────────────────────────────────
  # End-to-end: Playwright against `lanetrace ui` with the bundle
  # ────────────────────────────────────────────────────────────
  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-latest
    needs: ui
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - uses: actions/download-artifact@v8
        with:
          name: ui-bundle
          path: python-server/lanetrace/server/static
      - name: Install
        run: |
          uv venv .venv --python 3.12
          uv pip install --python .venv "./python-server[dev,e2e]"
          .venv/bin/playwright install --with-deps chromium
      # The suite skips without the bundle; in CI a missing bundle must fail.
      - name: Installed package ships the UI bundle
        run: .venv/bin/python -c "import lanetrace.server.app as a, pathlib; assert (pathlib.Path(a.__file__).parent/'static'/'index.html').is_file()"
      - name: E2E
        run: .venv/bin/pytest python-server/tests_e2e -q
      # dashboard, run and sign-in screens in each theme (saved by test_themes.py)
      - name: Upload theme screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: theme-screenshots
          path: python-server/tests_e2e/artifacts/
