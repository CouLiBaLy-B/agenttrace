[project]
name = "agenttrace-langchain"
version = "0.2.0"
description = "Deprecated shim — use deepagents-trace[langchain] (import agenttrace.langchain)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["deepagents-trace[langchain]>=0.2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-mock>=3.14", "pytest-asyncio>=0.24"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agenttrace_langchain*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
