site_name: LaneTrace
site_description: Live sequence diagrams for AI agents. An MLflow-style tracking SDK, a LangChain / deepagents integration, and a dashboard served by `lanetrace ui`.
site_url: https://coulibaly-b.github.io/lanetrace/
repo_url: https://github.com/CouLiBaLy-B/lanetrace
repo_name: CouLiBaLy-B/lanetrace
edit_uri: edit/main/docs/

# docs/ also holds internal specs and plans, the pre-0.2 (Next.js) manuals and
# the build requirements: none of them belong on the site.
exclude_docs: |
  superpowers/
  user-manual.md
  functional-documentation.md
  requirements.txt

# With `mkdocs build --strict`, any of these fails the build.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest
    - search.highlight
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Getting started:
      - Installation: install.md
      - Quickstart: quickstart.md
      - Coming from MLflow: mlflow.md
  - LangChain and deepagents:
      - Middleware: integration-middleware.md
      - Callback handlers: integration-callback.md
  - Reference:
      - Event contract: events.md
      - CLI: cli.md
  - Dashboard:
      - Themes: themes.md
  - Operations:
      - Deployment: deployment.md
      - Upgrading: upgrading.md
