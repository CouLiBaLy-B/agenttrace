[project]
name = "lanetrace"
version = "0.3.0"
description = "LaneTrace - observability for AI agents, MLflow-style: fluent tracking API, local SQLite by default, `lanetrace ui` for the live dashboard."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["agents", "llm", "observability", "tracing", "deepagents", "langchain"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "sqlalchemy>=2.0",
    "requests>=2.31",
    "click>=8.1",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "bcrypt>=4.0",
    "itsdangerous>=2.2",
    "websockets>=13.0",
]
postgres = ["psycopg[binary]>=3.1"]
e2e = ["playwright>=1.47", "pytest-playwright>=0.5"]
langchain = ["langchain>=1.0.0", "langchain-core>=1.0.0", "httpx>=0.27"]
dev = [
    "lanetrace[server,langchain]",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[project.urls]
Homepage = "https://github.com/CouLiBaLy-B/lanetrace"
Documentation = "https://coulibaly-b.github.io/lanetrace/"
Repository = "https://github.com/CouLiBaLy-B/lanetrace"
Issues = "https://github.com/CouLiBaLy-B/lanetrace/issues"

[project.scripts]
lanetrace = "lanetrace.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lanetrace*"]

[tool.setuptools.package-data]
lanetrace = ["server/static/**/*"]
