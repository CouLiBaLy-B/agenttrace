# LaneTrace — docker-compose: Postgres + the LaneTrace Python server.
# A deployment created before 0.3 (AgentTrace) keeps its Postgres volume, whose
# database, user and password are still `agenttrace`: set POSTGRES_DB,
# POSTGRES_USER and POSTGRES_PASSWORD to those values in .env. The volume is
# named after the compose project (the directory name by default): in a new
# checkout directory, set COMPOSE_PROJECT_NAME to the old one to keep it.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lanetrace}
      POSTGRES_USER: ${POSTGRES_USER:-lanetrace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lanetrace}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lanetrace} -d ${POSTGRES_DB:-lanetrace}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  lanetrace:
    build: .
    image: lanetrace:latest
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-lanetrace}:${POSTGRES_PASSWORD:-lanetrace}@db:5432/${POSTGRES_DB:-lanetrace}
      # Set LANETRACE_SECRET in .env (openssl rand -base64 32); the pre-0.3
      # name AGENTTRACE_SECRET is still accepted. Without either, the server
      # refuses to start (LANETRACE_REQUIRE_SECRET) instead of signing
      # sessions with a random per-process secret.
      LANETRACE_SECRET: ${LANETRACE_SECRET:-${AGENTTRACE_SECRET:-}}
      LANETRACE_REQUIRE_SECRET: "1"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
